<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sazón · Catálogo</title>
  <link rel="stylesheet" href="../../assets/css/sazon.css">
  <link rel="stylesheet" href="catalogo.css">
</head>
<body>
  <header data-layout="header"></header>

  <main class="contenedor pagina-modulo">
    <section class="bloque-modulo">
      <h1>Módulo Catálogo</h1>
      <p>Base lista para desarrollar historias de usuario del catálogo.</p>
      <div id="catalogo-estado" class="mensaje-estado" role="status"></div>


       <!-- Barra de acciones semántica -->
      <nav class="catalogo-acciones" aria-label="Controles del ejercicio MockAPI">
        <button id="btnImagenes" class="btn-primario" type="button">
          Obtener Imágenes de MockAPI
        </button>
      </nav>

      <!-- Sección principal de la galería visual -->
      <section id="cardContainer" class="card-container" aria-label="Galería de imágenes de productos">
        <p class="mensaje-estado">Presiona el botón para cargar las imágenes desde MockAPI.</p>
      </section>

  

    </section>
  </main>

  <footer data-layout="footer"></footer>

  <script src="../../services/api.config.js"></script>
  <script src="../../data/usuario.js"></script>
  <script src="../../data/productos.js"></script>
  <script src="../../data/recetas.js"></script>
  <script src="../../data/modulos.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="servicio.js"></script>
  <script src="index.js"></script>
</body>
</html>
