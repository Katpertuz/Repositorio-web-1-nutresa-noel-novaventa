<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sazón · Catálogo</title>
  <link rel="stylesheet" href="../../assets/css/sazon.css">
  <link rel="stylesheet" href="catalogo.css">
</head>
<body>
  <header data-layout="header"></header>

  <main class="contenedor pagina-modulo">
    <section class="bloque-modulo">
      <h1>Módulo Catálogo</h1>
      <p>Base lista para desarrollar historias de usuario del catálogo.</p>
      <div id="catalogo-estado" class="mensaje-estado" role="status"></div>

      <!-- ===== G1-MAR · Marca · inicio ===== -->
      <section class="catalogo-marcas" aria-labelledby="catalogo-marcas-titulo">
        <h2 id="catalogo-marcas-titulo" class="catalogo-solo-lector">Filtrar por marca</h2>
        <div id="catalogo-marcas"></div>
        <p id="catalogo-error" class="catalogo-error" role="alert" hidden></p>
      </section>
      <!-- ===== G1-MAR · Marca · fin ===== -->

      <!-- ===== G7-CUP · Cupón · inicio ===== -->
       // Duvan tique //
      <section class="contenedor-formulario" style="margin-top: 30px;">
        <h2>Registrar Presentación Comercial</h2>

        <form id="formCrearPresentacion" novalidate>
          <div class="grupo-campo">
            <label for="idPresentacion">idPresentacion</label>
            <input 
              type="text" 
              id="idPresentacion" 
              name="idPresentacion" 
              required 
              placeholder="Ej: PRES-001"
            />
          </div>

          <div class="grupo-campo">
            <label for="nombrePresentacion">nombrePresentacion</label>
            <input 
              type="text" 
              id="nombrePresentacion" 
              name="nombrePresentacion" 
              required 
              minlength="3" 
              placeholder="Ej: Sazón Premium Blend"
            />
          </div>

          <div class="grupo-campo">
            <label for="pesoNeto">pesoNeto</label>
            <input 
              type="number" 
              id="pesoNeto" 
              name="pesoNeto" 
              required 
              min="0.01" 
              step="0.01" 
              placeholder="Ej: 500.00"
            />
          </div>

          <button type="submit" id="btnGuardar">Guardar Presentación</button>
        </form>

        <div id="alertaFormulario" class="alerta" role="alert" aria-live="polite" hidden></div>
      </section>
      <!-- ===== G7-CUP · Cupón · fin ===== -->
    </section>
  </main>

  <footer data-layout="footer"></footer>

  <script src="../../services/api.config.js"></script>
  <script src="../../data/usuario.js"></script>
  <script src="../../data/productos.js"></script>
  <script src="../../data/recetas.js"></script>
  <script src="../../data/modulos.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="servicio.js"></script>
  <script src="index.js"></script>
</body>
</html>
